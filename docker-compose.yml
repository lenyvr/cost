services:
  pizzaioli-cost-db:
    image: postgres:18-alpine
    container_name: pizzaioli-cost-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT}:5432"
    volumes:
      - ./data_db:/var/lib/postgresql
    networks:
      - pizzaioli-network

  pizzaioli-cost-app:
    build: .
    container_name: pizzaioli-cost-app
    ports:
      - "${APP_EXTERNAL_PORT}:${APP_PORT}"
    env_file:
      - .env
    depends_on:
      - pizzaioli-cost-db
    networks:
      - pizzaioli-network
networks:
  pizzaioli-network:

